<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>消防水利マップ V3</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}#panel{position:absolute;z-index:1000;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));background:#fff;padding:10px;border-radius:10px;box-shadow:0 2px 12px #0003}.row{display:flex;gap:8px}.row>*{flex:1}button,input{font-size:16px;padding:11px;border-radius:8px;border:1px solid #aaa}button{font-weight:700;background:#fff}#run{background:#111;color:#fff}#status{font-size:12px;margin-top:6px}.leaflet-popup-content{font-size:15px;line-height:1.5}.nav{display:block;margin-top:8px;padding:8px;text-align:center;background:#111;color:#fff!important;text-decoration:none;border-radius:7px}.legend{position:absolute;z-index:999;right:10px;bottom:24px;background:#fff;padding:7px 9px;border-radius:8px;font-size:12px;box-shadow:0 2px 10px #0002}.legend img{width:22px;vertical-align:middle}</style></head>
<body><div id="map"></div><div id="panel"><div class="row"><button id="run">実行（コピーしたマピオンURL）</button><button id="loc">現在地</button></div><div class="row" style="margin-top:8px"><input id="manual" placeholder="マピオンURLを貼り付け"><button id="manualRun">表示</button></div><div id="status">水利データ読込中…</div></div><div class="legend"><div><img src="images/icon-1.png"> 消火栓</div><div><img src="images/icon-2.png"> 防火水槽</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false}).setView([36.31,139.20],13);L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const hi=L.icon({iconUrl:'images/icon-1.png',iconSize:[30,30],iconAnchor:[15,15]}),ti=L.icon({iconUrl:'images/icon-2.png',iconSize:[30,30],iconAnchor:[15,15]});
const st=document.getElementById('status');let incident=null,circles=[],me=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pop(p,ll){let a=[['種別',p.kind],['番号',p.number],['設置場所',p['設置場所']],['目標物',p['目標物']],['所管分団',p['所管分団']],['容量',p['容量']],['口径',p['消火栓口径']||p.KOUKEI],['型式',p['消火栓型式']],['種類',p['消火栓種類']]].filter(x=>x[1]);return a.map(x=>`<b>${esc(x[0])}</b>：${esc(x[1])}`).join('<br>')+`<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${ll.lat},${ll.lng}" target="_blank" rel="noopener">Googleマップで経路</a>`}
fetch('water.geojson').then(r=>r.json()).then(g=>{L.geoJSON(g,{pointToLayer:(f,ll)=>L.marker(ll,{icon:f.properties.kind==='防火水槽'?ti:hi}),onEachFeature:(f,l)=>l.bindPopup(()=>pop(f.properties,l.getLatLng()))}).addTo(map);st.textContent=`水利 ${g.features.length.toLocaleString()}件 読込完了（試作版）`}).catch(e=>st.textContent='水利データ読込失敗: '+e.message);
function ang(s){let a=String(s||'').split('/').map(Number);if(a.some(Number.isNaN))return NaN;if(a.length===3)return a[0]+a[1]/60+a[2]/3600;if(a.length===2)return a[0]+a[1]/60;return a[0]}
function ext(s){let m=String(s||'').match(/https?:\/\/[^\s<>"']+/i);if(!m)return null;try{let u=new URL(m[0].replace(/[、。)\]}>]+$/g,''));if(u.pathname.startsWith('/m2/')){let a=u.pathname.slice(4).split(',').map(Number);return {lat:a[0],lng:a[1]}}let la=u.searchParams.get('lat'),lo=u.searchParams.get('lon')||u.searchParams.get('lng')||u.searchParams.get('long');if(la&&lo)return{lat:+la,lng:+lo};let ll=u.searchParams.get('ll');if(ll){let a=ll.split(',').map(Number);return{lat:a[0],lng:a[1]}}let nl=u.searchParams.get('nl'),el=u.searchParams.get('el');if(nl&&el)return{lat:ang(nl),lng:ang(el)}}catch(e){}return null}
function conv(a,b){return{lat:a-.00010695*a+.000017464*b+.0046017,lng:b-.000046038*a-.000083043*b+.010040}}
function show(s){let c=ext(s);if(!c||!Number.isFinite(c.lat)||!Number.isFinite(c.lng)){st.textContent='マピオンURLから座標を取得できません';return}let w=conv(c.lat,c.lng);if(incident)map.removeLayer(incident);circles.forEach(x=>map.removeLayer(x));circles=[];incident=L.marker([w.lat,w.lng]).addTo(map).bindPopup('<b>災害地点</b>').openPopup();[100,200,300].forEach(r=>circles.push(L.circle([w.lat,w.lng],{radius:r,fill:false,weight:2}).addTo(map)));map.setView([w.lat,w.lng],16);st.textContent=`災害地点：${w.lat.toFixed(6)},${w.lng.toFixed(6)}（WGS84変換済）`}
document.getElementById('run').onclick=async()=>{try{show(await navigator.clipboard.readText())}catch(e){st.textContent='クリップボードを読めません。下の欄へ貼り付けてください。'}};
document.getElementById('manualRun').onclick=()=>show(document.getElementById('manual').value);
document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{let ll=[p.coords.latitude,p.coords.longitude];if(me)map.removeLayer(me);me=L.circleMarker(ll,{radius:8,weight:3,fillOpacity:.7}).addTo(map).bindPopup('現在地');map.panTo(ll);st.textContent=`現在地取得（精度 約${Math.round(p.coords.accuracy)}m）`},e=>st.textContent='現在地を取得できません: '+e.message,{enableHighAccuracy:true,timeout:10000});
</script></body></html>
